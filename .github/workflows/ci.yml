name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Unit, keyboard (real browser), every story with axe in both themes
        run: npm test
      - run: npm run build
      - run: npm run check:package

  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare with the base branch
        id: visual
        run: npm run visual -- "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        # Someone looked at the report and added the label: the change is intended.
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-approved') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: visual-report, path: visual/out, if-no-files-found: ignore }
